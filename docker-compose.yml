services:
  postgres-billing:
    build: .
    container_name: postgres_billing_db
    environment:
      POSTGRES_DB: billing_database
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./create_billing.sql:/docker-entrypoint-initdb.d/create_billing.sql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing_user -d billing_database" ]
      interval: 10s
      timeout: 5s
      retries: 5
